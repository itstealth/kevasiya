worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    map $request_uri $content_security_policy {
        default "default-src 'self' http: https: data: blob: 'unsafe-inline'";
        ~^/cms-blog/ "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'";
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $content_security_policy always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Basic Settings
    sendfile on;
    client_max_body_size 64M;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    # Upstream Servers
    upstream backend {
        server backend:5001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        server frontend:5001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Main Server
    server {
        listen 80;
        listen [::]:80;
        server_name kevasiya.com www.kevasiya.com;

        # Health Check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # WordPress CMS at /cms-blog/* - strip /cms-blog prefix and proxy
        location = /cms-blog/wp-admin {
            return 301 $forwarded_proto://$host/cms-blog/wp-admin/;
        }

        location /cms-blog/ {
            rewrite ^/cms-blog(/.*)$ $1 break;
            proxy_pass http://kevasiya_cms_blog_nginx/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Prefix /cms-blog;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
        }

        # Also handle /cms-blog without trailing slash
        location = /cms-blog {
            return 301 $forwarded_proto://$host/cms-blog/;
        }

        # Backend API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 90;
        }

        # Uploads
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Send stale or cached root admin URLs back to the blog install.
        location = /wp-admin {
            return 301 $forwarded_proto://$host/cms-blog/wp-admin/;
        }

        location /wp-admin/ {
            return 301 $forwarded_proto://$host/cms-blog/wp-admin/;
        }

        location = /wp-login.php {
            return 301 $forwarded_proto://$host/cms-blog/wp-login.php;
        }

        # Everything else -> Next.js Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90;
        }
    }
}