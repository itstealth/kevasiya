server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64M;

    # Block config backups, dotfiles and other sensitive artefacts
    location ~* /wp-config\.php.+ { deny all; return 404; }
    location ~* \.(bak|backup|old|orig|save|swp|swo|sql|tar|gz|tgz|zip|log)$ { deny all; return 404; }
    location ~* -(bak|backup|hardening)$ { deny all; return 404; }
    location ~ /\. { deny all; return 404; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass cms_blog_php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
        access_log off;
    }

    location ~ /\.ht {
        deny all;
    }
}
