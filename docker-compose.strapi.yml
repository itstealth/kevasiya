services:
  strapi:
    build:
      context: ./strapi_kevasiya_cms
      dockerfile: Dockerfile.secure
    container_name: kevasiya_strapi
    restart: unless-stopped
    ports:
      - "1337:1337"
    environment:
      - NODE_ENV=production
      - DATABASE_CLIENT=mysql
      - DATABASE_HOST=strapi_db
      - DATABASE_PORT=3306
      - DATABASE_NAME=strapi_kevasiya_db
      - DATABASE_USERNAME=strapi_app
      - STRAPI_URL=https://strapi.kevasiya.com
      - DATABASE_PASSWORD=${STRAPI_DB_PASSWORD}
      - JWT_SECRET=${STRAPI_JWT_SECRET}
      - ADMIN_JWT_SECRET=${STRAPI_ADMIN_JWT_SECRET}
      - APP_KEYS=${STRAPI_APP_KEYS}
      - API_TOKEN_SALT=${STRAPI_TOKEN_SALT}
      - TRANSFER_TOKEN_SALT=${STRAPI_TRANSFER_TOKEN_SALT}
      - STRAPI_TELEMETRY_DISABLED=true
    volumes:
      - strapi_uploads:/app/public/uploads
    networks:
      - strapi_network
    depends_on:
      strapi_db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.config:size=1m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').request('http://127.0.0.1:1337/_health', (r) => {if(r.statusCode >= 400) process.exit(1)}).on('error', () => process.exit(1)).end()"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  strapi_db:
    image: mysql:8.0
    container_name: kevasiya_strapi_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=strapi_kevasiya_db
      - MYSQL_USER=strapi_app
      - MYSQL_PASSWORD=${STRAPI_DB_PASSWORD}
    volumes:
      - strapi_mysql_data:/var/lib/mysql
      - ./strapi_mysql/conf.d:/etc/mysql/conf.d:ro
    networks:
      - strapi_network
    security_opt:
      - no-new-privileges:true
    read_only: false
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  strapi_nginx:
    image: nginx:alpine
    container_name: kevasiya_strapi_nginx
    restart: unless-stopped
    ports:
      - "1338:80"
    volumes:
      - ./strapi_nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./strapi_nginx/ssl:/etc/nginx/ssl:ro
      - strapi_uploads:/var/www/uploads:ro
    networks:
      - strapi_network
    depends_on:
      - strapi
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m

volumes:
  strapi_uploads:
    driver: local
  strapi_mysql_data:
    driver: local

networks:
  strapi_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
